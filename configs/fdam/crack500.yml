# Full FDAM training recipe with FDE, DFR, and AIR.
# Source: crack500_multitask_single_run.yml
# Run commands from the repository root.
task: detection
evaluator:
  type: CocoEvaluator
  iou_types:
  - bbox
num_classes: 1
remap_mscoco_category: false
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./data/crack500/images/train
    ann_file: ./data/crack500/annotations/instances_train.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Mosaic
        output_size: 320
        rotation_range: 10
        translation_range:
        - 0.1
        - 0.1
        scaling_range:
        - 0.5
        - 1.5
        probability: 1.0
        fill_value: 0
        use_cache: true
        max_cached_images: 50
        random_pop: true
      - type: RandomPhotometricDistort
        p: 0.5
      - type: RandomZoomOut
        fill: 0
      - type: RandomIoUCrop
        p: 0.8
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: RandomHorizontalFlip
      - type: Resize
        size:
        - 640
        - 640
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        name: stop_epoch
        epoch:
        - 4
        - 60
        - 94
        ops:
        - Mosaic
        - RandomPhotometricDistort
        - RandomZoomOut
        - RandomIoUCrop
      mosaic_prob: 0.5
    multi_task: true
  shuffle: true
  num_workers: 4
  drop_last: true
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: 20
    stop_epoch: 94
    mixup_prob: 0.5
    mixup_epochs:
    - 4
    - 60
    copyblend_prob: 0.5
    copyblend_epochs:
    - 4
    - 94
    area_threshold: 100
    num_objects: 3
    with_expand: true
    expand_ratios:
    - 0.1
    - 0.25
    ema_restart_decay: 0.9999
  total_batch_size: 8
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./data/crack500/images/val
    ann_file: ./data/crack500/annotations/instances_val.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 640
        - 640
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
    multi_task: true
  shuffle: false
  num_workers: 4
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
  total_batch_size: 8
print_freq: 500
output_dir: ./outputs/crack500
checkpoint_freq: 5
sync_bn: true
find_unused_parameters: true
use_amp: false
scaler:
  type: GradScaler
  enabled: true
use_ema: true
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
  start: 0
epoches: 100
clip_max_norm: 0.1
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$
    lr: 2.5e-05
  - params: ^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$
    lr: 2.5e-05
    weight_decay: 0.0
  - params: ^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$
    weight_decay: 0.0
  lr: 0.0005
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
lr_scheduler:
  type: MultiStepLR
  milestones:
  - 500
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
model: DEIM
criterion: DEIMCriterion
postprocessor: PostProcessor
use_focal_loss: true
eval_spatial_size:
- 640
- 640
DEIM:
  backbone: DINOv3STAs
  encoder: HybridEncoder
  decoder: DEIMTransformer
  use_decoupled_grid: false
  use_grid_guided_enhancement: true
  grid_head:
    type: FrequencyAttentionGridHead
    in_channels:
    - 192
    - 192
    - 192
    hidden_dim: 192
    num_classes: 1
    num_blocks: 2
    dropout: 0.1
    use_adf: true
    use_multi_scale: true
    use_frequency_attention: true
    freq_num_bands: 4
    freq_use_direction: false
    use_multi_scale_output: true
    use_det_feedback: false
  grid_enhancer:
    type: GridGuidedFeatureEnhancer
    channels: 192
    num_scales: 3
    num_classes: 1
    detach_grid: true
    max_gain: 0.06
    use_smooth: true
    smooth_kernel_size: 3
    min_gate: 0.0
    init_identity: true
    norm_type: gn
    gn_groups: 32
    conf_is_logits: false
    gate_power: 1.5
    enhance_levels:
    - 0
    - 1
    - 2
HybridEncoder:
  in_channels:
  - 192
  - 192
  - 192
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 192
  use_encoder_idx:
  - 2
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 512
  dropout: 0.0
  enc_act: gelu
  expansion: 0.34
  depth_mult: 0.67
  act: silu
  version: deim
  csp_type: csp2
  fuse_op: sum
DEIMTransformer:
  feat_channels:
  - 192
  - 192
  - 192
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 192
  num_levels: 3
  num_layers: 4
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points:
  - 3
  - 6
  - 3
  cross_attn_method: default
  query_select_method: default
  activation: silu
  mlp_act: silu
  dim_feedforward: 512
PostProcessor:
  num_top_queries: 300
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 1800
flat_epoch: 54
no_aug_epoch: 6
DEIMCriterion:
  weight_dict:
    loss_mal: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
    loss_vfl: 1
    loss_grid: 1.0
  losses:
  - vfl
  - boxes
  - local
  - grid
  gamma: 1.5
  alpha: 0.75
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 2
    alpha: 0.25
    gamma: 2.0
    change_matcher: false
    iou_order_alpha: 4.0
    matcher_change_epoch: 100
  use_uncertainty_weighting: false
  grid_focal_alpha: 0.5
  grid_focal_gamma: 1.5
  grid_focal_weight: 1.0
  use_direction_loss: false
  grid_use_adaptive_sampling: true
  grid_adaptive_uncertainty_gain: 1.0
  grid_adaptive_boundary_gain: 1.0
  grid_adaptive_boundary_kernel: 3
  grid_delta: 0.125
  grid_use_ohem: false
  grid_bg_suppression: 0.0
DINOv3STAs:
  name: vit_tiny
  embed_dim: 192
  weights_path: ./ckpts/vitt_distill.pt
  interaction_indexes:
  - 3
  - 7
  - 11
  num_heads: 3
resume:
tuning:
last_epoch: -1
reload_best_at_stop_epoch: false
best_metric: coco_eval_bbox
save_task_best: true
gradient_accumulation_steps: 1
